# Nav2 params for G1 + Unitree onboard SLAM (no AMCL, no obstacle avoidance).
# Config files live alongside this file in g1_api/: params.yaml, map.yaml, map.png
#
# TF tree (unitree_slam_bringup.launch.py + unitree_relocation_odom_bridge):
#   map --(static identity)--> odom --(bridge)--> base_link

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /unitree/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      enable_groot_monitoring: True
      groot_server_port: 1667

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05 #0.15
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.05 #0.15
    failure_tolerance: 0.3
    # current_progress_checker: "progress_checker"
    # current_goal_checker: "goal_checker"
    # current_path_handler: "PathHandler"          
    odom_topic: /unitree/odom
    odom_duration: 0.1
    costmap_update_timeout: 2.0

    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    path_handler_plugins: ["PathHandler"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.2
      movement_time_allowance: 20.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.4
      yaw_goal_tolerance: 0.4
      stateful: True

    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      prune_distance: 2.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      publish_critics_stats: false
      open_loop: true

      # 基础参数
      motion_model: "Omni"           # G1 使用差分驱动模型
      time_steps: 56                      # 预测步数
      model_dt: 0.05                      # 时间步长 0.05 秒 → 预测总时长 2.8 秒
      batch_size: 2000                    # 采样轨迹数
      iteration_count: 1                  # 保持 1，用更多采样代替迭代

      # 速度采样标准差
      vx_std: 0.6
      vy_std: 0.2
      wz_std: 1.0

      # 速度限制
      vx_max: 0.8                       # 最大速度
      vx_min: 0.0                         # 不允许后退（若需要后退可改为 -0.2）
      vy_max: 0.0                         # 差分驱动无横向速度
      wz_max: 0.8                         # 最大角速度


      # 路径修剪与容差
      prune_distance: 1.5                 # 修剪全局路径的距离
      transform_tolerance: 0.2
      enforce_path_inversion: false       # 不允许路径反向（保持前进）

      # 轨迹选择参数
      temperature: 0.6                    # 0 = 严格选最优，越大越平均
      gamma: 0.015                        # 平滑度与能耗权衡

      # 调试可视化
      visualize: true
      publish_optimal_trajectory: true

      # 轨迹可视化降采样（可选）
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      # ----- Critics 配置（权重根据避障需要调整）-----
      critics: [
        "VelocityDeadbandCritic",
        "ConstraintCritic",
        "ObstaclesCritic",
        "GoalCritic",
        "GoalAngleCritic",
        "PathAlignCritic",
        "PathFollowCritic",
        "PathAngleCritic",
        "PreferForwardCritic"
      ]

      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 30.0
        deadband_velocities: [0.15, 0.0, 0.15] 

      # 约束检查器
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 障碍物避让
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 10.0 #10.0             # 障碍物排斥权重
        critical_weight: 30.0             # 碰撞临界权重
        consider_footprint: false         # 圆形足迹，若需要更精确可改为 true 并配置 footprint
        collision_cost: 10000.0
        collision_margin_distance: 0.1
        near_goal_distance: 0.4
        cost_scaling_factor: 5.0
        inflation_radius: 0.4             # 应与局部代价地图膨胀半径一致

      # 目标距离
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0                 
        threshold_to_consider: 2.0
      # 目标角度
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        threshold_to_consider: 0.5

      # 路径对齐（让机器人尽量指向路径方向）
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 20.0
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false      # 设为 false 允许机器人自由转向避障

      # 路径角度（避免急转）
      PathAngleCritic:
        enabled: true
        cost_power: 2
        cost_weight: 10.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

      # 路径跟随（鼓励沿路径走）
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4

      # 优先前进（鼓励向前，不后退）
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        threshold_to_consider: 0.5

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# Local costmap: inflation-only layer (no obstacle sensors).
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0
      publish_frequency: 15.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.3
      plugins: ["obstacle_layer","inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pcl
        combination_method: 1
        observation_persistence: 0.0
        footprint_clearing_enabled: true
        transform_tolerance: 0.5

        pcl:
          topic: /utlidar/pcl2
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.3
          max_obstacle_height: 1.7
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          observation_persistence: 0.0
          expected_update_rate: 0.0
          inf_is_valid: true
          clear_after_reading: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.4
        cost_scaling_factor: 1.0
      always_send_full_costmap: true

  local_costmap_client:
    ros__parameters:
      use_sim_time: false

  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.3
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.0
        inflation_radius: 0.35

      always_send_full_costmap: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: False

  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: False

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: False
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 3.0
    use_sim_time: False
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.50
      use_astar: true
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: False

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.10
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.3
    min_rotational_vel: 0.15
    rotational_acc_lim: 3.2
    use_sim_time: False

robot_state_publisher:
  ros__parameters:
    use_sim_time: False

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

waypoint_follower_rclcpp_node:
  ros__parameters:
    use_sim_time: False
